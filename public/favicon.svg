<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c4433"/>
      <stop offset="100%" stop-color="#0c1c12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f5d27a"/>
      <stop offset="100%" stop-color="#b87e22"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="26%" r="52%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#d3a74d" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#d3a74d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topshine" cx="50%" cy="0%" r="60%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <circle cx="370" cy="192" r="114" fill="white"/>
      <circle cx="416" cy="150" r="110" fill="black"/>
    </mask>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feFlood flood-color="#d3a74d" flood-opacity="0.55" result="col"/>
      <feComposite in="col" in2="blur" operator="in" result="bloom"/>
      <feMerge><feMergeNode in="bloom"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="512" height="512" rx="110" fill="url(#glow)"/>
  <rect width="512" height="512" rx="110" fill="url(#topshine)"/>

  <!-- L letterform -->
  <path d="M96 100 H172 V338 H310 V416 H96 Z" fill="rgba(255,248,236,0.96)"/>

  <!-- Crescent moon -->
  <g filter="url(#bloom)">
    <circle cx="370" cy="192" r="114" fill="url(#gold)" mask="url(#crescent)"/>
  </g>

  <!-- Stars -->
  <circle cx="424" cy="332" r="15" fill="url(#gold)"/>
  <circle cx="382" cy="370" r="9"  fill="#d3a74d" opacity="0.65"/>
  <circle cx="452" cy="366" r="6"  fill="#d3a74d" opacity="0.4"/>
</svg>
